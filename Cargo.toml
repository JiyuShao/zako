[package]
name = "zakosh"
version = "0.1.0"
edition = "2021"
authors = ["Jiyu Shao <jiyu.shao@gmail.com>"]
description = "Zako Shell Companion: a lightweight Zsh companion"
license = "MIT"

[[bin]]
name = "zako"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
